[workspace]
members = ["crates/api", "crates/pgoutput", "crates/waltrail-log", "crates/worker-cdc"]

resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
description = "Waltrail — журнал аудита изменений PostgreSQL"

rust-version = "1.99.1"

# Политика линтов workspace: консервативный набор — то, что ловит реальные
# дефекты и мусор в коде, но не педантичные придирки, ломающие существующий
# код. Наследуется всеми крейтами через lints.workspace = true; ужесточения —
# осознанно, с прогоном всей обязательной проверки из AGENTS.md.
[workspace.lints.rust]
# Излишние квалификаторы путей (путь через модуль при уже импортированном
# имени) — шум в диффах при переименованиях.
unused_qualifications = "warn"

[workspace.lints.clippy]
# Базовый уровень — все правила корректности и стиля по умолчанию.
all = { level = "warn", priority = -1 }
# Явные маркеры незавершённости не должны попадать в main — только с
# обоснованием в коде (#[allow(clippy::todo)] /* причина */).
todo = "warn"
unimplemented = "warn"
# Отладочные распечатки — только tracing, stdout/stderr в коде не используем.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[workspace.dependencies]
pgoutput = { path = "crates/pgoutput" }
waltrail-log = { path = "crates/waltrail-log" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "uuid",
    "chrono",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "migrate",
    "any",
] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
tracing-appender = "0.2.5"
tokio-util = "0.7.20"
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "trace"] }
axum-valid = { version = "0.25.0", features = ["into_json", "json", "validator"] }
# Версия обязана совпадать с validator внутри axum-valid (иначе трейт Validate — другой)
validator = { version = "0.20.0", features = ["derive"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
pgwire-replication = "0.5.0"
bytes = "1.12.1"
config = { version = "0.15.27", default-features = false }
url = "2.5.8"
# Декодирование percent-encoding компонентов URL источника (крейт `url`
# хранит компоненты закодированными; та же зависимость у него внутри).
percent-encoding = "2.3.2"
