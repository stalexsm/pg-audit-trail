[workspace]
members = ["crates/api", "crates/worker-debezium", "crates/worker-app", "crates/pgoutput", "crates/worker-cdc"]

resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
description = "Waltrail — журнал аудита изменений PostgreSQL"

rust-version = "1.99.1"

[workspace.dependencies]
pgoutput = { path = "crates/pgoutput" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
dotenv = "0.15.0"
env_logger = "0.11.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
    "uuid",
    "chrono",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "json",
    "migrate",
    "any",
] }
sqlx-cli = "0.9.0"
tokio = { version = "1.54.0", features = ["full"] }
futures = "0.3.34"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
tracing-appender = "0.2.5"
redis = { version = "1.7.1", features = ["tokio-comp"] }
base64 = "0.23.1"
rayon = "1.12.0"
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
fancy-regex = "0.19.2"
lazy_static = "1.5.1"
axum = "0.8.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "trace"] }
axum-valid = { version = "0.25.0", features = ["into_json", "json", "validator"] }
# Версия обязана совпадать с validator внутри axum-valid (иначе трейт Validate — другой)
validator = { version = "0.20.0", features = ["derive"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
pgwire-replication = "0.5"
bytes = "1.12.1"
config = { version = "0.15", default-features = false }
url = "2.5.8"
