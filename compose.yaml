name: waltrail

networks:
  default:
    driver: bridge

volumes:
  db1-data:
  db-src-data:
  # Логи api и worker-cdc: named volume, а не bind mount, потому что контейнеры
  # работают под непривилегированным пользователем (UID 10001 из Dockerfile):
  # том при первом подключении наследует владельца из образа, bind mount с хоста
  # на Linux перекрыл бы её владельцем хоста, и запись в логи сломалась бы.
  app-logs:

services:
  # БД аудита Waltrail
  db1:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: postgres
    volumes:
      - db1-data:/var/lib/postgresql/data
    ports:
      - "54399:5432"

    networks:
      - default

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s

  # Источник CDC — имитация БД клиента (wal_level=logical, публикация создаётся из ./docker/init-source)
  db-src:
    image: postgres:17.4
    restart: always
    command:
      ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: postgres
    volumes:
      - db-src-data:/var/lib/postgresql/data
      - ./docker/init-source:/docker-entrypoint-initdb.d:ro
    ports:
      - "54398:5432"

    networks:
      - default

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s

  api:
    build:
      context: .
      target: final
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - app-logs:/app/logs
    depends_on:
      db1:
        condition: service_healthy

    networks:
      - default

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      retries: 5
      start_period: 60s
      timeout: 20s

  # Консюмер логической репликации: слот источника → таблица changes
  worker-cdc:
    build:
      context: .
      target: final
    restart: always
    command: ["/app/worker-cdc"]
    env_file:
      - ./.env
    volumes:
      - app-logs:/app/logs
    depends_on:
      db1:
        condition: service_healthy
      db-src:
        condition: service_healthy

    networks:
      - default
