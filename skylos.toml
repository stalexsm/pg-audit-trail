# Конфиг сканера skylos: гейт CI (джоба skylos в .github/workflows/ci.yml)
# запускается командой:
#   skylos . --secrets --danger --gate --config-file skylos.toml \
#     --exclude target --exclude README.md --exclude AGENTS.md \
#     --exclude GLOSSARY.md --exclude CHANGELOG.md
# Исключения папок передаются ТОЛЬКО через CLI: при --config-file ключ
# exclude в этом файле перекрывает CLI-флаги, а на md-скан (SKY-D260/D266)
# TOML-exclude не действует вовсе (проверено на skylos 4.50.1).

[tool.skylos]
# SKY-D266 и SKY-D260 (гомоглифы) глушим целиком: репозиторий русскоязычный,
# правила ловят русские «о», «с», «Н», «у» как подмену латиницы (o, c, H, y)
# в README и документации и всегда дают ложные срабатывания.
#
# SKY-D211 (SQL-инъекция) глушится осознанно: правило не понимает композицию
# psycopg (sql.SQL + sql.Identifier + sql.Literal, параметры через %s) и
# помечает любое построение SQL-выражения в scripts/loadgen. Inline-подавление
# # skylos: ignore[SKY-D211] на строках без вызова execute не работает
# (проверено на 4.50.1). Все SQL-пути loadgen — параметризованные или
# собранные из целочисленных значений; остальные danger-правила активны.
ignore = ["SKY-D266", "SKY-D260", "SKY-D211"]
