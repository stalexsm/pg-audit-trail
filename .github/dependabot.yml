# Обновления версий GitHub Actions (workflow ci.yml).
#
# Все actions запинены на полные commit SHA (проверяет гейт skylos, SKY-D292) —
# апгрейды тянет Dependabot, а не ручные правки: он поднимает SHA и сам
# обновляет комментарий версии рядом с пином.
#
# Значение экосистемы — именно «github-actions» (и по таблице доков, и по enum
# валидатора Dependabot). С невалидным значением конфиг отбраковывается
# целиком, а ошибка видна в check «.github/dependabot.yml» на PR и в
# Insights → Dependency graph → Dependabot.
#
# Каждый PR бота прогоняет все гейты ci.yml; в main обновление попадает только
# через required check «gates» в branch protection.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflows лежат в .github/workflows — от корня репозитория.
    directory: "/"
    schedule:
      interval: "weekly"
    # Свежевыпущенные версии выдерживаем 7 дней перед бампом (гейт semgrep,
    # dependabot-missing-cooldown): защита от только что опубликованных,
    # потенциально скомпрометированных или нестабильных версий.
    cooldown:
      default-days: 7
